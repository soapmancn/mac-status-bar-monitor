name: Release macOS App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version or tag name, for example v1.0.0"
        required: false
        default: "dev"
      publish_release:
        description: "Create or update a GitHub Release"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-release:
    name: Build macOS release
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Resolve release version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
          else
            version="dev-${GITHUB_SHA:0:7}"
          fi
          echo "RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "release_version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Package app
        run: |
          chmod +x scripts/build_app.sh scripts/package_release.sh
          scripts/package_release.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacStatusBarMonitor-${{ env.RELEASE_VERSION }}-macos
          path: |
            dist/release/*.dmg
            dist/release/*.zip
            dist/release/*-checksums.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || inputs.publish_release == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_VERSION}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_VERSION}" dist/release/* --clobber
          else
            gh release create "${RELEASE_VERSION}" dist/release/* \
              --title "MacStatusBarMonitor ${RELEASE_VERSION}" \
              --notes-file dist/release-notes.md
          fi
